<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid {
            font-family: sans-serif;
            display: grid;
            grid-template-columns: repeat(2, 200px);
        }
        .item-grid {
            display: grid;
        }
        .item-grid img,
        .item-grid h2 {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            align-self: center;
            height: 100%;
        }
        .item-grid h2{
            color: white;
            background-color: black;
            margin: 0;
            opacity: 0;
            transition: 0.3s ease;
            display: grid;
            

        }

        .item-grid:hover h2 {
            opacity: 1;
        }


    </style>
</head>
<body>
    <h1>Grid Layout</h1>
    <div class="grid">
        <div class="item-grid">
            <img src="https://picsum.photos/id/230/400/400" alt="Image 1">
            <h2>Image 1</h2>
</body>
</html>
